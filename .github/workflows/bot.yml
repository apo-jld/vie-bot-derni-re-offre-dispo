name: VIE Bot

on:
  schedule:
    # Journée (toutes les 15 min)
    - cron: "7,22,37,52 5-21 * * *"

    # Nuit (toutes les 2h)
    - cron: "7 22,0,2,4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python -m playwright install chromium

      - run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save seen offers
        run: |
          git config user.name "vie-alert-bot"
          git config user.email "vie-alert-bot@users.noreply.github.com"
          git add seen_offers.json
          git commit -m "Update seen offers" || echo "No changes"
          git push
          
